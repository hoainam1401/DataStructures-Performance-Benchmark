name: Build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Smoke test time benchmark
        run: ${{ runner.os == 'Windows' && './build/Release/benchmark.exe' || './build/benchmark' }} --iterations 2 --prefill 3
      - name: Smoke test RAM benchmark
        run: ${{ runner.os == 'Windows' && './build/Release/benchmarkRAM.exe' || './build/benchmarkRAM' }} --prefill 100
